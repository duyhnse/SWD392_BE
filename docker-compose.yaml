services:
  postgres:
    image: postgres:16-alpine
    container_name: aives_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aives_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    ports:
      # Bound to localhost only: Docker bypasses the host firewall, never publish a DB on 0.0.0.0
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Executed only on the first startup (empty volume). To re-apply: docker compose down -v
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
