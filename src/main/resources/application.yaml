spring:
  application:
    name: AIVES
  config:
    # Local developer settings live in an untracked .env file (see .env.example)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aives_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # Schema is owned by Flyway (db/migration); Hibernate only verifies it matches the entities.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

application:
  security:
    jwt:
      # Base64-encoded secret of at least 256 bits. Required: no default on purpose.
      secret-key: ${JWT_SECRET}
      # 86400000 ms = 24 hours
      expiration: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    # mock = deterministic adapters, no API keys (default). real = provider adapters (M3).
    mode: ${AI_MODE:mock}
    embedding:
      dimension: 1536
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/storage}
