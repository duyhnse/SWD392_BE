spring:
  application:
    name: AIVES
  config:
    # Local developer settings live in an untracked .env file (see .env.example)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aives_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # Schema is owned by Flyway (db/migration); Hibernate only verifies it matches the entities.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  mail:
    # Only used when application.mail.mode=smtp (e.g. Gmail: smtp.gmail.com:587 + an app password)
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  # Trust X-Forwarded-* from the reverse proxy (Caddy) so client IPs are real (rate limits, BR-A3)
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # Mail is optional (MAIL_MODE=log by default); an unreachable SMTP server must not mark the app DOWN.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

application:
  # Used to build links in emails (password reset)
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  dev:
    # Development only: lets anyone create LECTURER/STUDENT accounts from the forgot-password page (14 §3.7, D39)
    self-registration-enabled: ${DEV_SELF_REGISTRATION:false}
  google:
    # Firebase project whose ID tokens are accepted for Google linking / sign-in (14 §3.5, D36)
    firebase-project-id: ${FIREBASE_PROJECT_ID:aives-55658}
  mail:
    # log = write emails to the log (default); smtp = send through spring.mail.*
    mode: ${MAIL_MODE:log}
    from: ${MAIL_FROM:AIVES <no-reply@vindng.com>}
  security:
    jwt:
      # Base64-encoded secret of at least 256 bits. Required: no default on purpose.
      secret-key: ${JWT_SECRET}
      # 86400000 ms = 24 hours
      expiration: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    # mock = deterministic adapters, no API keys (default). real = provider adapters (M3).
    mode: ${AI_MODE:mock}
    embedding:
      dimension: 1536
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/storage}
